schema: spec-driven

context: |
  Project: Feel You — a mobile app for deaf-blind people to communicate with the world using only a phone.

  Tech stack: Flutter (Dart) with Riverpod, in app/. Android, and iPhone on iOS (no iPad). Landscape only.
  Project status: Phase 1 is built and released (see README.md, ROADMAP.md and CHANGELOG.md).
  The main specs in openspec/specs/ describe the shipped app.

  Domain: Accessibility / assistive technology for deaf-blind communication.
  The entire interface uses two channels:
    - Input: touch (tap, hold, swipe) and shaking the phone
    - Output: vibration (Morse patterns and a few distinct signals)
  No sight or hearing needed. A dim overlay and screen-reader labels exist only for sighted helpers.

  Phase 1: a Morse code learning tool that works through vibration alone.
    - Six languages (English, Arabic, Russian, Spanish, French, German), each with three levels in order: digits 0-9, letters, 20 words.
    - The app plays the current item, pauses 3 s and repeats it forever. Words are spelled letter by letter before they are drilled.
    - The user taps the item back; the answer is checked after 1 s without a tap, or at once with a bottom-strip tap.
    - Correct: five quick 50 ms taps. Wrong: one 500 ms buzz. Then the same item again; the app never moves on by itself.
    - The chosen language and the learned items (answered correctly once in the lessons) are saved. Level and position live in memory; every launch starts at digit 0.
    - Phase 2 groundwork: the assistant's OpenRouter key can be kept in the Keychain / Android Keystore (this device only, never backed up or logged, shown masked); deleting it plays the cloud-off signal (two 700 ms buzzes). No screen to enter it yet.
    - Each level ends with a quiz (swipe right past the last item): Morse ? marks it, it plays random learned items, the user echoes them.
    - Design philosophy: closer to a musical instrument than a language app.

  Lesson screen (black, landscape): the left half is a dot and the right half a dash, decided by where a press starts, not how long it lasts.
  The bottom 15% strip submits the answer on digits and letters, and adds a letter gap on words.
  Gestures: swipe right/left = next/previous item, swipe up/down = next/previous level, hold 2 s = first item of the level,
  shake = home (digits, 0), double shake = back to the language picker.
  Language picker: first launch and double shake; tap or swipe to highlight (each answered with the language's Morse identifier), hold 1 s to start.

  Future phases: words/sentences, speech-to-Morse, text-to-Morse, Morse-to-text, real-time conversation.

rules:
  proposal:
    - Always include a "Non-goals" section
    - Consider accessibility implications in every decision — the user cannot see or hear
    - Keep proposals focused on one phase at a time
  design:
    - All user-facing interactions must work through touch input and vibration output only
    - Prefer simple, stateless designs — minimize what the app needs to remember
    - Document vibration patterns and timing explicitly
  tasks:
    - Break tasks into chunks of max 2 hours
    - Include Flutter platform considerations (iOS/Android differences) where relevant
    - Test tasks should cover haptic feedback behavior
