name: CI

on:
  push:
    branches: [master]
  pull_request:

# One run per branch/PR. Superseded PR runs are cancelled; an in-progress
# master run is allowed to finish (the newer push waits for it).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every job pins the same Flutter version (flutter-version below). Bump them
# together: the platform projects in app/android and app/ios are migrated
# for that exact version.
jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.3" # Dart 3.13.3; keep in sync with local dev
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # Infos are temporarily non-fatal: ~150 pre-existing very_good_analysis
      # infos remain. Warnings and errors still fail the build. Switch to
      # --fatal-infos once they are cleaned up.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --coverage

  build-android:
    name: Build Android (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      # Gradle 9 and AGP 9 need JDK 17, as in the `flutter create` template.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.3" # keep in sync with the other jobs
          cache: true

      - name: Build APK
        run: flutter build apk --debug

      # A build on a new Flutter version may migrate the platform projects.
      # Fail so that the migration gets reviewed and committed.
      - name: Check the build left tracked files unchanged
        run: git diff --exit-code

  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.3" # keep in sync with the other jobs
          cache: true

      - name: Build iOS app
        run: flutter build ios --no-codesign --debug

      - name: Check the build left tracked files unchanged
        run: git diff --exit-code
