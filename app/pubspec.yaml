name: feel_you
description: A mobile app for deaf-blind people to communicate with the world using only a phone.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.2.0
  riverpod_annotation: ^2.6.1
  sensors_plus: ^7.1.1
  shared_preferences: ^2.5.6
  vibration: ^3.2.1
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
